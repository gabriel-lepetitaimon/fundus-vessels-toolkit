# yaml-language-server: $schema=experiment.schema.json
project: Topo-GNN
experiment: HP-Search
version: 2
tag: hp-search
n_trials: 20
optuna:
  direction: maximize
  sampler:
    type: TPE
    n_startup_trials: 8
  pruner:
    type: Median
    n_startup_trials: 8

log_model: false
parameters_grid: 
  - simple-long: 
      archi: InstNorm Conv64x8-DropOut InstNorm Conv128x8-DropOut Conv256x4 Conv128x8 Conv256x4 Conv128x8 Conv256x4 Conv512x2
      bipole: false
  - simple-short: 
      archi: InstNorm Conv64x8-DropOut InstNorm Conv128x8 Conv256x4 Conv512x2
      bipole: false
  - bipole-long: 
      archi: InstNorm Conv64x8-DropOut InstNorm Conv128x8-DropOut Conv256x4 Conv128x8 Conv256x4 Conv128x8 Conv256x4 Conv512x2
      bipole: true
  - bipole-short: 
      archi: InstNorm Conv64x8-DropOut InstNorm Conv128x8 Conv256x4 Conv512x2
      bipole: true
---
# yaml-language-server: $schema=config.schema.json
epoch: 200
lr: 1e-4~1e-2
batch_size: 4:4:20
dataset:
  augment:
    deteriorate_graph: true|false
model:
  gcn:
    bipolar_node: $bipole
    architecture: $archi
