# yaml-language-server: $schema=experiment.schema.json
project: Topo-GNN
experiment: HP-Search
version: 4
tag: hp-search
n_trials: 15
optuna:
  direction: maximize
  sampler:
    type: GP
    n_startup_trials: 3
  pruner:
    type: PercentileProgressive
    n_startup_trials: 3
    final_step: 200
    final_percentile: 33
    n_min_trials: 3

log_model: false
parameters_grid: 
  - bipole-long: 
        archi: InstNorm Conv16x8-DropOut InstNorm Conv32x8-DropOut Conv64x4 Conv32x8 Conv64x4 Conv32x8 Conv64x4 Conv32x8 Conv64x4 Conv128x4 Conv256x2
        bipole: true
  - bipole-medium: 
        archi: InstNorm Conv16x8-DropOut InstNorm Conv32x8-DropOut Conv64x4 Conv32x8 Conv64x4 Conv32x8 Conv64x4 Conv128x4 Conv256x2
        bipole: true
  - bipole-short: 
        archi: InstNorm Conv16x8-DropOut InstNorm Conv32x8-DropOut Conv64x4 Conv32x8 Conv64x4 Conv128x4 Conv256x2
        bipole: true
  - bipole-shorter: 
        archi: InstNorm Conv16x8-DropOut InstNorm Conv32x8-DropOut Conv64x4 Conv128x4 Conv256x2
        bipole: true
  - bipole-medium-double: 
        archi: InstNorm Conv24x8-DropOut InstNorm Conv48x8-DropOut Conv96x4 Conv48x8 Conv96x4 Conv48x8 Conv96x4 Conv128x4 Conv256x2
        bipole: true
  - simple-long: 
        archi: InstNorm Conv16x8-DropOut InstNorm Conv32x8-DropOut Conv64x4 Conv32x8 Conv64x4 Conv32x8 Conv64x4 Conv32x8 Conv64x4 Conv128x4 Conv256x2
        bipole: false
  - simple-medium: 
        archi: InstNorm Conv16x8-DropOut InstNorm Conv32x8-DropOut Conv64x4 Conv32x8 Conv64x4 Conv32x8 Conv64x4 Conv128x4 Conv256x2
        bipole: false
  - simple-short: 
        archi: InstNorm Conv16x8-DropOut InstNorm Conv32x8-DropOut Conv64x4 Conv32x8 Conv64x4 Conv128x4 Conv256x2
        bipole: false
  - simple-shorter: 
        archi: InstNorm Conv16x8-DropOut InstNorm Conv32x8-DropOut Conv64x4 Conv128x4 Conv256x2
        bipole: false
  - simple-medium-double: 
        archi: InstNorm Conv24x8-DropOut InstNorm Conv48x8-DropOut Conv96x4 Conv48x8 Conv96x4 Conv48x8 Conv96x4 Conv128x4 Conv256x2
        bipole: false
---
# yaml-language-server: $schema=config.schema.json
epoch: 200
lr: 5e-4~50e-4
batch_size: 20 
model:
  gcn:
    bipolar_node: $bipole
    architecture: $archi
    
  img_feature_extractor: 
    type: efficientnet_v2_s
    pretrained: true
    end_stage: 5